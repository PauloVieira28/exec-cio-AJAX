<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" src="https://via.placeholder.com/180x180" alt=".">
            <h1 class="profile-name"></h1>
            <h2 class="profile-username"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4 id="repository"></h4>
                </li>
                <li class="numbers-item">
                    <h4 id="follow"></h4>
                </li>
                <li class="numbers-item">
                    <h4 id="following"></h4>
                </li>
            </ul>
            <a href="#" class="profile-link">Ver no GitHub</a>
        </div>
    </header>
    <script>
        document.addEventListener('DOMContentLoaded', async function(){
            const $ = (selector) => document.querySelector(selector);
            const avatar = $('.profile-avatar')
            const name = $('.profile-name')
            const userName = $('.profile-username')
            const repository = $('#repository')
            const following = $('#following')
            const follow = $('#follow')
            const link = $('.profile-link')
            try{
                const response = await fetch('https://api.github.com/users/PauloVieira28')
                const json = await response.json()

                avatar.src = json.avatar_url
                userName.innerText = json.login
                name.innerText = json.name
                repository.innerText = `Repositório 
                    ${json.public_repos}`
                following.innerText = `Seguidores 
                    ${json.following}`
                follow.innerText = `Seguindo 
                    ${json.followers}`
                link.href = json.html_url
            
            } catch(error){
                console.error("Erro ao buscar dados do GitHub:", error);
            };
        })
    </script>
</body>
</html>
